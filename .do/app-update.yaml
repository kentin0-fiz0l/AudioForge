name: audioforge
region: sfo
features:
  - buildpack-stack=ubuntu-22
static_sites:
  - name: audioforge-website
    git:
      branch: main
      repo_clone_url: https://github.com/kentin0-fiz0l/AudioForge.git
    source_dir: /website
    output_dir: out
    build_command: npm run build
    catchall_document: index.html
    environment_slug: node-js
    envs:
      - key: NODE_VERSION
        value: "18"
        scope: BUILD_TIME

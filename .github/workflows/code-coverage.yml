name: Code Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.15.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lcov \
            gcovr \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libjack-jackd2-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            mesa-common-dev

      - name: Build tests with coverage
        working-directory: tests
        run: |
          cmake -B build \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel

      - name: Run tests
        working-directory: tests
        run: |
          ./build/TestRunner

      - name: Generate coverage report
        working-directory: tests
        run: |
          # Create coverage directory
          mkdir -p coverage

          # Capture coverage data
          lcov --capture \
            --directory build \
            --output-file coverage/coverage.info \
            --rc branch_coverage=1 \
            --ignore-errors inconsistent,gcov,format,count,unsupported,deprecated

          # Remove external libraries and test code from coverage
          lcov --remove coverage/coverage.info \
            '*/JUCE/*' \
            '*/tests/*' \
            '/usr/*' \
            '*/Applications/*' \
            '*/Library/*' \
            --output-file coverage/coverage_filtered.info \
            --rc branch_coverage=1 \
            --ignore-errors inconsistent,format,unused

          # Generate HTML report
          genhtml coverage/coverage_filtered.info \
            --output-directory coverage/html \
            --title "AudioForge Code Coverage" \
            --rc branch_coverage=1 \
            --legend \
            --branch-coverage \
            --ignore-errors inconsistent,corrupt,format,empty,category,unsupported

          # Generate summary
          lcov --summary coverage/coverage_filtered.info \
            --rc branch_coverage=1 \
            --ignore-errors inconsistent,corrupt,format

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: tests/coverage/coverage_filtered.info
          flags: unittests
          name: audioforge-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/coverage/html
          retention-days: 30

      - name: Coverage Summary
        working-directory: tests
        run: |
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          lcov --summary coverage/coverage_filtered.info \
            --rc branch_coverage=1 \
            --ignore-errors inconsistent,corrupt,format 2>&1 | \
            grep -A 3 "lines......:" | \
            sed 's/^/  /' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full coverage report available in artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Check coverage threshold
        working-directory: tests
        run: |
          # Extract line coverage percentage
          COVERAGE=$(lcov --summary coverage/coverage_filtered.info \
            --rc branch_coverage=1 \
            --ignore-errors inconsistent,corrupt,format 2>&1 | \
            grep "lines......:" | \
            grep -o '[0-9]\+\.[0-9]\+%' | head -1 | sed 's/%//')

          echo "Current coverage: ${COVERAGE}%"

          # Set minimum threshold (as integer percentage for comparison)
          THRESHOLD=45

          # Convert coverage to integer for comparison
          COVERAGE_INT=$(echo "$COVERAGE" | cut -d. -f1)

          # Compare coverage to threshold
          if [ "$COVERAGE_INT" -lt "$THRESHOLD" ]; then
            echo "::warning::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            echo "::notice::Target coverage threshold: ${THRESHOLD}%"
            # Don't fail initially - just warn
            # exit 1
          else
            echo "::notice::Coverage ${COVERAGE}% meets or exceeds threshold ${THRESHOLD}%"
          fi

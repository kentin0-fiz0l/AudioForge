name: Code Quality Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  clang-format-check:
    name: Check Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14

      - name: Check formatting
        run: |
          # Find all C++ source files (excluding JUCE and build artifacts)
          FILES=$(find plugins shared -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            ! -path "*/build/*" \
            ! -path "*/*_artefacts/*" \
            ! -path "*/JuceLibraryCode/*" 2>/dev/null || true)

          echo "✅ Code formatting check complete (informational only)"

  portable-constants:
    name: Portable Constants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: No M_PI in plugin or shared code
        run: |
          # Microsoft's compiler does not define M_PI, and plugins are only
          # built on Linux here, so a plugin that uses it would only fail on
          # a Windows build. Use a local constant or juce::MathConstants.
          # (Comments that mention it are fine.)
          if grep -rnw --include='*.cpp' --include='*.h' 'M_PI' plugins shared \
              | grep -v '//.*M_PI' ; then
            echo "M_PI is not portable: use juce::MathConstants<float>::pi or a local constant"
            exit 1
          fi
          echo "No M_PI found"

  remote-script-tests:
    name: Remote Script Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run the AI Producer Remote Script tests
        run: |
          # Live runs this script in its own Python, so nothing else imports
          # it. These tests load it against a fake of Live's API, which is
          # enough to catch a script that cannot be imported at all.
          python3 --version
          python3 -m unittest discover -s ableton/tests -v

name: Code Quality Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  clang-format-check:
    name: Check Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14

      - name: Check formatting
        run: |
          # Find all C++ source files (excluding JUCE and build artifacts)
          FILES=$(find plugins shared -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            ! -path "*/build/*" \
            ! -path "*/*_artefacts/*" \
            ! -path "*/JuceLibraryCode/*" 2>/dev/null || true)

          echo "✅ Code formatting check complete (informational only)"

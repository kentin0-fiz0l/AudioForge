name: Release

# Builds every plugin on macOS (universal), Windows and Linux, makes an installer for each
# platform, and attaches them to a GitHub release.
#   - Pushing a tag vX.Y.Z publishes release vX.Y.Z.
#   - Running it by hand makes a draft release (only collaborators can see it) unless
#     "publish" is ticked; that is how to test a change to this workflow.
# The installers are not code-signed: there is no Apple Developer ID or Windows certificate.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 2.1.0 (the release is tagged v<version>)'
        required: true
      publish:
        description: 'Publish the release (otherwise it stays a draft)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLUGINS_PER_SHARD: 6

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.shards.outputs.matrix }}
      count: ${{ steps.shards.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 2.1.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing AudioForge $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Split plugins into shards
        id: shards
        run: |
          mapfile -t plugins < <(find plugins -mindepth 2 -maxdepth 2 -name CMakeLists.txt \
            | xargs -n1 dirname | xargs -n1 basename | grep -E '^[A-Za-z0-9_-]+$' | sort)
          echo "count=${#plugins[@]}" >> "$GITHUB_OUTPUT"
          matrix=$(printf '%s\n' "${plugins[@]}" | jq -R -s -c --argjson size "$PLUGINS_PER_SHARD" '
            split("\n") | map(select(length > 0)) as $p
            | [range(0; $p | length; $size) as $i | {shard: ($i / $size + 1), plugins: ($p[$i:$i + $size] | join(" "))}]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "${#plugins[@]} plugins in $(echo "$matrix" | jq length) shards" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.os.name }} ${{ matrix.shard.shard }}
    needs: plan
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: macOS, runner: macos-14 }
          - { name: Windows, runner: windows-2022 }
          - { name: Linux, runner: ubuntu-22.04 }   # older glibc, so the build runs on more distributions
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libcurl4-openssl-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev libjack-jackd2-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev \
            mesa-common-dev

      - name: Build
        shell: bash
        run: .github/scripts/build-release-shard.sh stage ${{ matrix.shard.plugins }}

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os.name }}-${{ matrix.shard.shard }}
          path: logs/

      - name: Upload stage
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.os.name }}-${{ matrix.shard.shard }}
          path: stage/
          if-no-files-found: error
          retention-days: 3

  package-macos:
    name: Package macOS
    needs: [plan, build]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-macOS-*
          path: stage
          merge-multiple: true
      - name: Check the build is universal
        run: |
          bad=0
          for bundle in stage/VST3/*.vst3 stage/AU/*.component stage/Standalone/*.app; do
            [ -e "$bundle" ] || continue
            binary=$(find "$bundle/Contents/MacOS" -type f | head -1)
            archs=$(lipo -archs "$binary")
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::$bundle is $archs"; bad=1 ;; esac
          done
          exit $bad
      - name: Make installer
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: installers/macos/make-pkg.sh stage "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macOS
          path: dist/

  package-windows:
    name: Package Windows
    needs: [plan, build]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-Windows-*
          path: stage
          merge-multiple: true
      - name: Make installer and zip
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          Copy-Item installers\README-install.txt stage\README.txt
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stage = (Resolve-Path stage).Path
          $exe = Join-Path (Resolve-Path dist).Path "AudioForge-$env:VERSION-Windows-Setup.exe"
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $makensis /V2 "/DVERSION=$env:VERSION" "/DSTAGE=$stage" "/DOUTFILE=$exe" installers\windows\AudioForge.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = "AudioForge-$env:VERSION-Windows"
          New-Item -ItemType Directory -Force -Path "zip\$folder" | Out-Null
          Copy-Item -Recurse stage\* "zip\$folder\"
          Compress-Archive -Path "zip\$folder" -DestinationPath "dist\$folder.zip"
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: dist-Windows
          path: dist/

  package-linux:
    name: Package Linux
    needs: [plan, build]
    runs-on: ubuntu-22.04
    env:
      FOLDER: AudioForge-${{ needs.plan.outputs.version }}-Linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-Linux-*
          path: stage
          merge-multiple: true
      - name: Make tarball
        run: |
          mkdir -p "pkg/$FOLDER" dist
          cp -R stage/. "pkg/$FOLDER/"
          rmdir "pkg/$FOLDER/AU" 2>/dev/null || true
          chmod +x "pkg/$FOLDER"/Standalone/* 2>/dev/null || true
          cp installers/README-install.txt "pkg/$FOLDER/README.txt"
          cp installers/linux/install.sh "pkg/$FOLDER/"
          tar -C pkg -czf "dist/$FOLDER.tar.gz" "$FOLDER"
          ls -lh dist
      - name: Check install.sh works
        run: |
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf "dist/$FOLDER.tar.gz"
          export VST3_DIR="$tmp/vst3" BIN_DIR="$tmp/bin"
          "$tmp/$FOLDER/install.sh"
          test "$(ls "$VST3_DIR" | wc -l)" -gt 0
          "$tmp/$FOLDER/install.sh" --uninstall
          test "$(ls "$VST3_DIR" | wc -l)" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: dist-Linux
          path: dist/

  release:
    name: Publish release
    needs: [plan, package-macos, package-windows, package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Release notes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          # This version's CHANGELOG section, if it has one
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on && $0 != "---"' CHANGELOG.md > changes.md
          # The fixed part of the notes, with this version filled in
          cat > template.md <<'EOF'
          ## Download

          | Platform | Installer | Or copy by hand |
          |---|---|---|
          | macOS 11+ (Apple Silicon and Intel) | `AudioForge-VERSION-macOS.pkg` | `AudioForge-VERSION-macOS.zip` |
          | Windows 10/11 (64-bit) | `AudioForge-VERSION-Windows-Setup.exe` | `AudioForge-VERSION-Windows.zip` |
          | Linux x86_64 | `AudioForge-VERSION-Linux-x86_64.tar.gz` (run `./install.sh`) | |

          VST3 on every platform, AU on macOS, and standalone apps for most plugins.

          ## The installers are not code-signed

          AudioForge has no Apple Developer ID or Windows signing certificate, so your system asks once:
          - **macOS:** if the installer won't open, go to System Settings > Privacy & Security and click **Open Anyway**.
          - **Windows:** if SmartScreen appears, click **More info**, then **Run anyway**.

          Check a download against `SHA256SUMS.txt` if you want to be sure it is the file built here.
          EOF
          {
            echo "AudioForge $VERSION: $COUNT free, open-source plugins (MIT License)."
            echo
            if [ -s changes.md ]; then cat changes.md; echo; fi
            sed "s/VERSION/$VERSION/g" template.md
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        run: |
          draft=()
          [ "$PUBLISH" = true ] || draft=(--draft)
          gh release create "v$VERSION" dist/* --title "AudioForge $VERSION" --notes-file notes.md \
            --target "$GITHUB_SHA" "${draft[@]}"
          echo "Release v$VERSION $([ "$PUBLISH" = true ] && echo published || echo 'saved as a draft')" >> "$GITHUB_STEP_SUMMARY"

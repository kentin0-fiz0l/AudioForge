version: 2

updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # JUCE is pinned to a release tag (currently 9.0.1) and upgraded by hand.
  # Dependabot's gitsubmodule updater can only follow a branch tip, so it is
  # intentionally not enabled for the JUCE submodule.

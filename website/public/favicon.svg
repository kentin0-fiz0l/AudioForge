<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0e14"/>
  <rect width="64" height="64" rx="12" fill="url(#gradient)" opacity="0.1"/>

  <!-- Waveform bars -->
  <g transform="translate(12, 32)">
    <!-- Bar 1 -->
    <rect x="0" y="-6" width="3" height="12" rx="1.5" fill="url(#barGradient)"/>
    <!-- Bar 2 -->
    <rect x="5" y="-12" width="3" height="24" rx="1.5" fill="url(#barGradient)"/>
    <!-- Bar 3 -->
    <rect x="10" y="-16" width="3" height="32" rx="1.5" fill="url(#barGradient)"/>
    <!-- Bar 4 -->
    <rect x="15" y="-10" width="3" height="20" rx="1.5" fill="url(#barGradient)"/>
    <!-- Bar 5 -->
    <rect x="20" y="-14" width="3" height="28" rx="1.5" fill="url(#barGradient)"/>
    <!-- Bar 6 -->
    <rect x="25" y="-8" width="3" height="16" rx="1.5" fill="url(#barGradient)"/>
    <!-- Bar 7 -->
    <rect x="30" y="-15" width="3" height="30" rx="1.5" fill="url(#barGradient)"/>
    <!-- Bar 8 -->
    <rect x="35" y="-11" width="3" height="22" rx="1.5" fill="url(#barGradient)"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="barGradient" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
</svg>

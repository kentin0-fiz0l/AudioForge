<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0e14"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="meterGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Fader Track -->
  <rect x="170" y="60" width="60" height="180" rx="30" fill="#1f2937" stroke="#374151" stroke-width="2"/>

  <!-- Fader Fill (Active) -->
  <rect x="170" y="140" width="60" height="100" rx="30" fill="url(#gainGradient)" opacity="0.3"/>

  <!-- Fader Handle -->
  <g filter="drop-shadow(0 4px 8px rgba(6, 182, 212, 0.3))">
    <rect x="160" y="130" width="80" height="40" rx="20" fill="url(#gainGradient)"/>
    <line x1="185" y1="145" x2="185" y2="155" stroke="#0a0e14" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="145" x2="200" y2="155" stroke="#0a0e14" stroke-width="2" stroke-linecap="round"/>
    <line x1="215" y1="145" x2="215" y2="155" stroke="#0a0e14" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Scale Marks -->
  <line x1="145" y1="70" x2="155" y2="70" stroke="#6b7280" stroke-width="2"/>
  <text x="130" y="75" fill="#9ca3af" font-size="12" text-anchor="end">+12</text>

  <line x1="145" y1="110" x2="155" y2="110" stroke="#6b7280" stroke-width="2"/>
  <text x="130" y="115" fill="#9ca3af" font-size="12" text-anchor="end">+6</text>

  <line x1="145" y1="150" x2="155" y2="150" stroke="#6b7280" stroke-width="2"/>
  <text x="130" y="155" fill="#9ca3af" font-size="12" text-anchor="end">0</text>

  <line x1="145" y1="190" x2="155" y2="190" stroke="#6b7280" stroke-width="2"/>
  <text x1="130" y="195" fill="#9ca3af" font-size="12" text-anchor="end">-12</text>

  <line x1="145" y1="230" x2="155" y2="230" stroke="#6b7280" stroke-width="2"/>
  <text x="130" y="235" fill="#9ca3af" font-size="12" text-anchor="end">-60</text>

  <!-- Level Meter -->
  <rect x="260" y="60" width="30" height="180" rx="15" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <rect x="260" y="120" width="30" height="120" rx="15" fill="url(#meterGradient)" opacity="0.8"/>

  <!-- Title -->
  <text x="200" y="35" fill="#e4e7eb" font-size="20" font-weight="bold" text-anchor="middle">SimpleGain</text>

  <!-- Glow Effect -->
  <circle cx="200" cy="150" r="100" fill="url(#gainGradient)" opacity="0.05"/>
</svg>

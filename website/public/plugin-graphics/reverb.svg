<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0e14"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="reverbGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Room Visualization -->
  <rect x="80" y="80" width="240" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>

  <!-- Direct Sound -->
  <circle cx="100" cy="150" r="12" fill="#06b6d4" opacity="0.9">
    <animate attributeName="r" values="12;15;12" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Early Reflections -->
  <circle cx="160" cy="120" r="8" fill="#06b6d4" opacity="0.6"/>
  <circle cx="180" cy="180" r="8" fill="#06b6d4" opacity="0.6"/>
  <circle cx="200" cy="100" r="6" fill="#06b6d4" opacity="0.5"/>
  <circle cx="220" cy="200" r="6" fill="#06b6d4" opacity="0.5"/>

  <!-- Late Reflections (Diffuse) -->
  <circle cx="250" cy="130" r="5" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="270" cy="170" r="5" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="280" cy="150" r="4" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="290" cy="140" r="4" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="300" cy="160" r="3" fill="#8b5cf6" opacity="0.2"/>

  <!-- Reflection Lines -->
  <line x1="100" y1="150" x2="160" y2="120" stroke="#06b6d4" stroke-width="1" opacity="0.3" stroke-dasharray="2 2"/>
  <line x1="100" y1="150" x2="180" y2="180" stroke="#06b6d4" stroke-width="1" opacity="0.3" stroke-dasharray="2 2"/>
  <line x1="160" y1="120" x2="250" y2="130" stroke="#8b5cf6" stroke-width="1" opacity="0.2" stroke-dasharray="2 2"/>
  <line x1="180" y1="180" x2="270" y2="170" stroke="#8b5cf6" stroke-width="1" opacity="0.2" stroke-dasharray="2 2"/>

  <!-- Decay Indicator -->
  <rect x="140" y="235" width="120" height="30" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="200" y="255" fill="#e4e7eb" font-size="12" text-anchor="middle" font-weight="bold">DECAY: 2.5s</text>

  <!-- Title -->
  <text x="200" y="35" fill="#e4e7eb" font-size="20" font-weight="bold" text-anchor="middle">Reverb</text>

  <!-- Glow Effect -->
  <circle cx="200" cy="150" r="130" fill="#06b6d4" opacity="0.05"/>
</svg>

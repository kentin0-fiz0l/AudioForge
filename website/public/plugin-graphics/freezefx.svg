<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0e14"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="freezeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Waveform Container -->
  <rect x="60" y="80" width="280" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>

  <!-- Normal Waveform (before freeze) -->
  <path d="M 70 150 Q 95 130 120 150 Q 145 170 170 150"
        stroke="#6b7280" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Frozen Section -->
  <rect x="165" y="95" width="100" height="110" fill="url(#freezeGradient)" opacity="0.1"/>
  <rect x="165" y="95" width="100" height="110" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Sustained Waveform (frozen) -->
  <path d="M 170 150 L 260 150" stroke="url(#freezeGradient)" stroke-width="3" fill="none"/>
  <path d="M 170 140 L 260 140" stroke="url(#freezeGradient)" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 170 160 L 260 160" stroke="url(#freezeGradient)" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Continuation after freeze -->
  <path d="M 260 150 Q 285 130 310 150 Q 335 170 360 150"
        stroke="#6b7280" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Freeze Indicator -->
  <text x="215" y="120" fill="#06b6d4" font-size="24" text-anchor="middle">❄️</text>
  <text x="215" y="190" fill="#06b6d4" font-size="10" text-anchor="middle">FROZEN</text>

  <!-- Freeze Button -->
  <rect x="150" y="235" width="100" height="30" rx="8" fill="#06b6d4" opacity="0.2"/>
  <rect x="150" y="235" width="100" height="30" rx="8" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <text x="200" y="255" fill="#06b6d4" font-size="12" text-anchor="middle" font-weight="bold">FREEZE</text>

  <!-- Title -->
  <text x="200" y="35" fill="#e4e7eb" font-size="20" font-weight="bold" text-anchor="middle">FreezeFX</text>

  <!-- Glow Effect -->
  <circle cx="200" cy="150" r="120" fill="#06b6d4" opacity="0.05"/>
</svg>

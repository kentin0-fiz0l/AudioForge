<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0e14"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="synthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Keyboard Keys (White) -->
  <rect x="60" y="180" width="35" height="80" rx="3" fill="#e4e7eb" stroke="#1f2937" stroke-width="1"/>
  <rect x="105" y="180" width="35" height="80" rx="3" fill="#e4e7eb" stroke="#1f2937" stroke-width="1"/>
  <rect x="150" y="180" width="35" height="80" rx="3" fill="#e4e7eb" stroke="#1f2937" stroke-width="1"/>
  <rect x="195" y="180" width="35" height="80" rx="3" fill="#06b6d4" stroke="#1f2937" stroke-width="1" opacity="0.8"/>
  <rect x="240" y="180" width="35" height="80" rx="3" fill="#e4e7eb" stroke="#1f2937" stroke-width="1"/>
  <rect x="285" y="180" width="35" height="80" rx="3" fill="#e4e7eb" stroke="#1f2937" stroke-width="1"/>
  <rect x="330" y="180" width="35" height="80" rx="3" fill="#e4e7eb" stroke="#1f2937" stroke-width="1"/>

  <!-- Keyboard Keys (Black) -->
  <rect x="85" y="180" width="25" height="50" rx="2" fill="#1f2937"/>
  <rect x="130" y="180" width="25" height="50" rx="2" fill="#1f2937"/>
  <rect x="220" y="180" width="25" height="50" rx="2" fill="#1f2937"/>
  <rect x="265" y="180" width="25" height="50" rx="2" fill="#1f2937"/>
  <rect x="310" y="180" width="25" height="50" rx="2" fill="#1f2937"/>

  <!-- Waveform Display -->
  <rect x="60" y="60" width="280" height="100" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>

  <!-- Sine Wave -->
  <path d="M 70 110 Q 100 80 130 110 T 190 110 T 250 110 T 310 110" stroke="url(#synthGradient)" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- ADSR Envelope Overlay -->
  <path d="M 70 130 L 100 90 L 140 100 L 220 100 L 310 130" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="4 4"/>

  <!-- Labels -->
  <text x="70" y="55" fill="#9ca3af" font-size="10">OSCILLATOR</text>
  <text x="250" y="55" fill="#9ca3af" font-size="10">ENVELOPE</text>

  <!-- Title -->
  <text x="200" y="35" fill="#e4e7eb" font-size="20" font-weight="bold" text-anchor="middle">BasicSynth</text>

  <!-- Glow Effect -->
  <circle cx="200" cy="140" r="120" fill="url(#synthGradient)" opacity="0.05"/>
</svg>

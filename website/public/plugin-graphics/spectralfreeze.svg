<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0e14"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="spectralGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Spectrogram Container -->
  <rect x="60" y="80" width="280" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>

  <!-- Frequency Grid -->
  <line x1="60" y1="150" x2="340" y2="150" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="60" y1="180" x2="340" y2="180" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="60" y1="120" x2="340" y2="120" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Spectral Bins (before freeze) -->
  <rect x="70" y="140" width="8" height="60" fill="#3b82f6" opacity="0.3"/>
  <rect x="85" y="130" width="8" height="70" fill="#3b82f6" opacity="0.3"/>
  <rect x="100" y="150" width="8" height="50" fill="#06b6d4" opacity="0.3"/>
  <rect x="115" y="120" width="8" height="80" fill="#06b6d4" opacity="0.3"/>
  <rect x="130" y="135" width="8" height="65" fill="#06b6d4" opacity="0.3"/>

  <!-- Frozen Spectral Section -->
  <rect x="145" y="90" width="100" height="130" fill="url(#spectralGradient)" opacity="0.1"/>
  <rect x="145" y="90" width="100" height="130" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Frozen Bins (sustained) -->
  <rect x="150" y="100" width="8" height="100" fill="url(#spectralGradient)" opacity="0.8"/>
  <rect x="165" y="110" width="8" height="90" fill="url(#spectralGradient)" opacity="0.7"/>
  <rect x="180" y="95" width="8" height="105" fill="url(#spectralGradient)" opacity="0.8"/>
  <rect x="195" y="105" width="8" height="95" fill="url(#spectralGradient)" opacity="0.7"/>
  <rect x="210" y="100" width="8" height="100" fill="url(#spectralGradient)" opacity="0.8"/>
  <rect x="225" y="115" width="8" height="85" fill="url(#spectralGradient)" opacity="0.6"/>

  <!-- Spectral Bins (after freeze) -->
  <rect x="250" y="145" width="8" height="55" fill="#8b5cf6" opacity="0.3"/>
  <rect x="265" y="155" width="8" height="45" fill="#8b5cf6" opacity="0.3"/>
  <rect x="280" y="140" width="8" height="60" fill="#8b5cf6" opacity="0.3"/>
  <rect x="295" y="150" width="8" height="50" fill="#8b5cf6" opacity="0.3"/>
  <rect x="310" y="160" width="8" height="40" fill="#8b5cf6" opacity="0.3"/>

  <!-- Freeze Indicator -->
  <text x="195" y="115" fill="#06b6d4" font-size="20" text-anchor="middle">❄️</text>

  <!-- Frequency Labels -->
  <text x="50" y="98" fill="#9ca3af" font-size="9" text-anchor="end">20k</text>
  <text x="50" y="128" fill="#9ca3af" font-size="9" text-anchor="end">2k</text>
  <text x="50" y="158" fill="#9ca3af" font-size="9" text-anchor="end">200</text>
  <text x="50" y="188" fill="#9ca3af" font-size="9" text-anchor="end">20</text>

  <!-- Control Panel -->
  <rect x="140" y="235" width="120" height="30" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="200" y="255" fill="#06b6d4" font-size="12" text-anchor="middle" font-weight="bold">SPECTRAL FREEZE</text>

  <!-- Title -->
  <text x="200" y="35" fill="#e4e7eb" font-size="20" font-weight="bold" text-anchor="middle">SpectralFreeze</text>

  <!-- Glow Effect -->
  <circle cx="200" cy="150" r="120" fill="#06b6d4" opacity="0.05"/>
</svg>

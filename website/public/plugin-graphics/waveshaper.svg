<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0e14"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Input Waveform (Sine) -->
  <rect x="60" y="60" width="130" height="80" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="125" y="50" fill="#9ca3af" font-size="10" text-anchor="middle">INPUT</text>
  <path d="M 70 100 Q 90 80 105 100 T 140 100 T 175 100" stroke="#10b981" stroke-width="3" fill="none"/>

  <!-- Arrow -->
  <path d="M 200 100 L 240 100" stroke="#06b6d4" stroke-width="2" fill="none"/>
  <polygon points="240,100 230,95 230,105" fill="#06b6d4"/>

  <!-- Output Waveform (Shaped) -->
  <rect x="250" y="60" width="130" height="80" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="315" y="50" fill="#9ca3af" font-size="10" text-anchor="middle">OUTPUT</text>
  <path d="M 260 100 L 280 80 L 285 85 L 295 75 L 305 100 L 315 125 L 320 120 L 330 130 L 350 100" stroke="#f59e0b" stroke-width="3" fill="none"/>

  <!-- Transfer Curve -->
  <rect x="100" y="160" width="200" height="100" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="200" y="180" fill="#9ca3af" font-size="10" text-anchor="middle">TRANSFER CURVE</text>

  <!-- Curve Grid -->
  <line x1="200" y1="190" x2="200" y2="250" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="120" y1="220" x2="280" y2="220" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- S-Curve -->
  <path d="M 120 250 Q 150 240 180 220 Q 200 210 220 200 Q 250 190 280 180"
        stroke="url(#waveGradient)" stroke-width="3" fill="none"/>

  <!-- Title -->
  <text x="200" y="35" fill="#e4e7eb" font-size="20" font-weight="bold" text-anchor="middle">WaveShaper</text>

  <!-- Glow Effect -->
  <circle cx="200" cy="150" r="120" fill="#f59e0b" opacity="0.05"/>
</svg>

<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0e14"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="chorusGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Modulation Visualization -->
  <rect x="60" y="80" width="280" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>

  <!-- Original Signal -->
  <path d="M 70 150 Q 110 130 150 150 Q 190 170 230 150 Q 270 130 310 150 Q 350 170 370 150"
        stroke="#6b7280" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="4 4"/>
  <text x="70" y="75" fill="#6b7280" font-size="10">DRY</text>

  <!-- Modulated Signals -->
  <path d="M 70 145 Q 110 125 150 145 Q 190 165 230 145 Q 270 125 310 145 Q 350 165 370 145"
        stroke="url(#chorusGradient)" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 70 155 Q 110 135 150 155 Q 190 175 230 155 Q 270 135 310 155 Q 350 175 370 155"
        stroke="url(#chorusGradient)" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 70 160 Q 110 140 150 160 Q 190 180 230 160 Q 270 140 310 160 Q 350 180 370 160"
        stroke="url(#chorusGradient)" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- LFO Indicator -->
  <path d="M 80 240 Q 120 250 160 240 Q 200 230 240 240 Q 280 250 320 240"
        stroke="#8b5cf6" stroke-width="2" fill="none"/>
  <circle cx="80" cy="240" r="4" fill="#8b5cf6"/>
  <circle cx="160" cy="240" r="4" fill="#8b5cf6"/>
  <circle cx="240" cy="240" r="4" fill="#8b5cf6"/>
  <circle cx="320" cy="240" r="4" fill="#8b5cf6"/>
  <text x="200" y="265" fill="#8b5cf6" font-size="10" text-anchor="middle">MODULATION</text>

  <!-- Title -->
  <text x="200" y="35" fill="#e4e7eb" font-size="20" font-weight="bold" text-anchor="middle">ChorusFlanger</text>

  <!-- Glow Effect -->
  <circle cx="200" cy="150" r="120" fill="#8b5cf6" opacity="0.05"/>
</svg>

<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0e14"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="eqGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- EQ Graph Background -->
  <rect x="60" y="80" width="280" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>

  <!-- Grid Lines -->
  <line x1="60" y1="150" x2="340" y2="150" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="130" y1="80" x2="130" y2="220" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="200" y1="80" x2="200" y2="220" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="270" y1="80" x2="270" y2="220" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- EQ Curve -->
  <path d="M 60 150 Q 95 110 130 120 Q 165 130 200 130 Q 235 130 270 100 Q 305 70 340 110"
        stroke="url(#eqGradient)" stroke-width="3" fill="none"/>

  <!-- EQ Curve Fill -->
  <path d="M 60 220 L 60 150 Q 95 110 130 120 Q 165 130 200 130 Q 235 130 270 100 Q 305 70 340 110 L 340 220 Z"
        fill="url(#eqGradient)" opacity="0.2"/>

  <!-- Control Points -->
  <circle cx="95" cy="110" r="6" fill="#f59e0b" filter="drop-shadow(0 2px 4px rgba(245, 158, 11, 0.5))"/>
  <circle cx="200" cy="130" r="6" fill="#06b6d4" filter="drop-shadow(0 2px 4px rgba(6, 182, 212, 0.5))"/>
  <circle cx="305" cy="70" r="6" fill="#8b5cf6" filter="drop-shadow(0 2px 4px rgba(139, 92, 246, 0.5))"/>

  <!-- Frequency Labels -->
  <text x="95" y="245" fill="#f59e0b" font-size="11" text-anchor="middle">LOW</text>
  <text x="200" y="245" fill="#06b6d4" font-size="11" text-anchor="middle">MID</text>
  <text x="305" y="245" fill="#8b5cf6" font-size="11" text-anchor="middle">HIGH</text>

  <!-- dB Labels -->
  <text x="50" y="95" fill="#9ca3af" font-size="10" text-anchor="end">+12</text>
  <text x="50" y="155" fill="#9ca3af" font-size="10" text-anchor="end">0</text>
  <text x="50" y="215" fill="#9ca3af" font-size="10" text-anchor="end">-12</text>

  <!-- Title -->
  <text x="200" y="35" fill="#e4e7eb" font-size="20" font-weight="bold" text-anchor="middle">SimpleEQ</text>

  <!-- Glow Effect -->
  <circle cx="200" cy="150" r="120" fill="#06b6d4" opacity="0.05"/>
</svg>

<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0e14"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="grainGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Audio Grains Container -->
  <rect x="60" y="80" width="280" height="140" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>

  <!-- Source Waveform (background) -->
  <path d="M 70 150 Q 110 130 150 150 Q 190 170 230 150 Q 270 130 310 150 Q 350 170 370 150"
        stroke="#374151" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- Individual Grains -->
  <g opacity="0.8">
    <!-- Grain 1 -->
    <ellipse cx="100" cy="150" rx="15" ry="30" fill="#8b5cf6" opacity="0.6"/>
    <path d="M 90 150 Q 100 140 110 150 Q 100 160 90 150" stroke="#8b5cf6" stroke-width="2" fill="none"/>
  </g>

  <g opacity="0.7">
    <!-- Grain 2 -->
    <ellipse cx="150" cy="140" rx="18" ry="35" fill="#06b6d4" opacity="0.6"/>
    <path d="M 138 140 Q 150 128 162 140 Q 150 152 138 140" stroke="#06b6d4" stroke-width="2" fill="none"/>
  </g>

  <g opacity="0.8">
    <!-- Grain 3 -->
    <ellipse cx="200" cy="160" rx="12" ry="25" fill="#f59e0b" opacity="0.6"/>
    <path d="M 192 160 Q 200 152 208 160 Q 200 168 192 160" stroke="#f59e0b" stroke-width="2" fill="none"/>
  </g>

  <g opacity="0.6">
    <!-- Grain 4 -->
    <ellipse cx="250" cy="145" rx="20" ry="38" fill="#8b5cf6" opacity="0.6"/>
    <path d="M 236 145 Q 250 130 264 145 Q 250 160 236 145" stroke="#8b5cf6" stroke-width="2" fill="none"/>
  </g>

  <g opacity="0.7">
    <!-- Grain 5 -->
    <ellipse cx="300" cy="155" rx="16" ry="32" fill="#06b6d4" opacity="0.6"/>
    <path d="M 288 155 Q 300 142 312 155 Q 300 168 288 155" stroke="#06b6d4" stroke-width="2" fill="none"/>
  </g>

  <!-- Grain Parameters -->
  <text x="80" y="245" fill="#8b5cf6" font-size="10">SIZE: 50ms</text>
  <text x="180" y="245" fill="#06b6d4" font-size="10">DENSITY: 8</text>
  <text x="280" y="245" fill="#f59e0b" font-size="10">PITCH: ±7st</text>

  <!-- Title -->
  <text x="200" y="35" fill="#e4e7eb" font-size="20" font-weight="bold" text-anchor="middle">GranularEngine</text>

  <!-- Glow Effect -->
  <circle cx="200" cy="150" r="120" fill="url(#grainGradient)" opacity="0.05"/>
</svg>

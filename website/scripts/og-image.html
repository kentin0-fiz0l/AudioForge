<!doctype html>

     headless browser screenshot of this file. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #0a0e14; overflow: hidden;
    font-family: -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif; color: #e4e7eb; }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(900px 500px at 85% 110%, rgba(6,182,212,.22), transparent 60%),
                radial-gradient(700px 400px at 0% -10%, rgba(245,158,11,.14), transparent 60%); }
  .wrap { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 22px; font-size: 44px; font-weight: 700; letter-spacing: -0.5px; }

  h1 { font-size: 76px; line-height: 1.05; margin: 64px 0 0; font-weight: 800; letter-spacing: -1.5px; }
  h1 span { background: linear-gradient(90deg, #06b6d4, #f59e0b); -webkit-background-clip: text; color: transparent; }
  p { font-size: 30px; color: #9ca3af; margin: 28px 0 0; }
  .chips { margin-top: auto; display: flex; gap: 14px; }
  .chips div { font: 600 22px ui-monospace, Menlo, monospace; color: #9ca3af; padding: 10px 20px;
    border: 1px solid rgba(6,182,212,.35); border-radius: 999px; }
  .bars { position: absolute; right: 80px; bottom: 150px; display: flex; gap: 14px; align-items: center; height: 260px; }
  .bars i { display: block; width: 18px; border-radius: 9px; background: linear-gradient(180deg, #06b6d4, #f59e0b); opacity: .9; }
</style></head><body>
